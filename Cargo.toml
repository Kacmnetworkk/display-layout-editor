[package]
name = "displayeditor-rav"
version = "0.1.0"
edition = "2024"
description = "A safe visual display layout editor for Omarchy and Hyprland"
license = "MIT"
homepage = "https://kacm1network.org"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
